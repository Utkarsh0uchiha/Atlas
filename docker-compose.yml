services:
  server1:
    build:
      context: .
      dockerfile: cmd/server1/Dockerfile
    ports:
      - "8081:8081"
  server2:
    build:
      context: .
      dockerfile: cmd/server2/Dockerfile
    ports:
      - "8082:8082"

  server3:
    build:
      context: .
      dockerfile: cmd/server3/Dockerfile
    ports:
      - "8083:8083"
  proxy:
    build:
      context: .
      dockerfile: cmd/proxy/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - server1
      - server2
      - server3
    environment:
      BACKEND_1: "http://server1:8081"
      BACKEND_2: "http://server2:8082"
      BACKEND_3: "http://server3:8083"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
